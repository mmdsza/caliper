[project]
name = "caliper-kappa"
version = "0.0.1"
description = "Cohen's kappa agreement between a grader and a labeled reference set."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "caliper-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper_kappa"]
