[project]
name = "easytrain-store"
version = "0.0.1"
description = "Versioned, content-addressed eval-set storage for EasyTrain."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "easytrain-sdk",
]

[project.optional-dependencies]
# Required when EASYTRAIN_STORE_URL points at a Postgres instance. SQLite
# uses Python's stdlib sqlite3, so this is not needed for local dev.
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easytrain_store"]
