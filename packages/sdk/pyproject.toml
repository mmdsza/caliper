[project]
name = "easytrain-sdk"
version = "0.0.1"
description = "Typed @grader decorator, runner, and shared types for the EasyTrain grader IDE."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easytrain_sdk"]
