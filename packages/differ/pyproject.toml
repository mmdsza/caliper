[project]
name = "easytrain-differ"
version = "0.0.1"
description = "Diff grader version v1 vs v2 on the same eval set."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "easytrain-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easytrain_differ"]
