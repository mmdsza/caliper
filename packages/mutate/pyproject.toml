[project]
name = "caliper-mutate"
version = "0.0.1"
description = "Mutation testing for graders — perturb rollouts, assert grader rank-orders survive."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "caliper-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper_mutate"]
