[project]
name = "caliper"
version = "0.0.1"
description = "Testing and CI layer for model behavior — grader IDE + reward-function CI/CD."
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = [
    "packages/sdk",
    "packages/rft_compile",
    "packages/differ",
    "packages/monitor",
    "packages/mutate",
    "packages/kappa",
    "packages/store",
    "packages/server",
]

[tool.uv.sources]
caliper-sdk = { workspace = true }
caliper-rft = { workspace = true }
caliper-differ = { workspace = true }
caliper-monitor = { workspace = true }
caliper-mutate = { workspace = true }
caliper-kappa = { workspace = true }
caliper-store = { workspace = true }
caliper-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "caliper-sdk",
    "caliper-rft",
    "caliper-differ",
    "caliper-monitor",
    "caliper-mutate",
    "caliper-kappa",
    "caliper-store",
    "caliper-server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N"]

[tool.pytest.ini_options]
testpaths = [
    "packages/sdk/tests",
    "packages/rft_compile/tests",
    "packages/differ/tests",
    "packages/monitor/tests",
    "packages/mutate/tests",
    "packages/kappa/tests",
    "packages/store/tests",
    "packages/server/tests",
]
addopts = "-ra --strict-markers --import-mode=importlib"
