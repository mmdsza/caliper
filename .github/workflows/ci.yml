name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check packages

      - name: Test
        run: uv run pytest -q

  smokes:
    name: offline smokes
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      - name: smoke_dry_run
        run: uv run python scripts/smoke_dry_run.py

      - name: smoke_mutation_test
        run: uv run python scripts/smoke_mutation_test.py

      - name: smoke_rft_passthrough
        run: uv run python scripts/smoke_rft_passthrough.py

      - name: smoke_kappa_tracking
        run: uv run python scripts/smoke_kappa_tracking.py

      - name: smoke_e2b_sandbox
        run: uv run python scripts/smoke_e2b_sandbox.py

  editor:
    name: editor typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: packages/editor/pnpm-lock.yaml

      - name: Install editor deps
        run: pnpm --dir packages/editor install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir packages/editor typecheck

      - name: Build
        run: pnpm --dir packages/editor build
